<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a237e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZUB Finance">
  <title>ZUB'S SOLUTIONS — Finance Portal</title>

  <!-- GAS deployment URL configured ✅ (updated 2026-09-22) -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a237e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Full-screen iframe — no borders, no scrollbars on the wrapper */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading screen shown while the iframe boots */
    #loader {
      position: fixed;
      inset: 0;
      background: #1a237e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }

    .loader-logo {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      text-align: center;
      line-height: 1.1;
    }
    .loader-sub {
      font-size: 13px;
      color: rgba(255,255,255,.65);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #ffd54f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading splash (disappears once iframe loads) -->
  <div id="loader">
    <div class="loader-logo">ZUB'S<br>SOLUTIONS</div>
    <div class="loader-sub">Finance Portal</div>
    <div class="loader-spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwxKu1tDhI7mm8HNsLR3YwQZ7Ohvi4DAgQvrVhNWc8Ufd3_FXeeRfLU-Ca_UzMQE-PS7A/exec?embedded=true"
    allow="camera; microphone; geolocation"
    loading="eager"
  ></iframe>

  <script>
    // Hide the loading screen once the iframe has loaded
    document.getElementById('app-frame').addEventListener('load', function() {
      var loader = document.getElementById('loader');
      loader.classList.add('hidden');
      setTimeout(function() { loader.style.display = 'none'; }, 450);
    });

    // Fallback: hide loader after 8 seconds regardless
    setTimeout(function() {
      var loader = document.getElementById('loader');
      if (loader) { loader.classList.add('hidden'); setTimeout(function(){ loader.style.display='none'; }, 450); }
    }, 8000);
  </script>
</body>
</html>
